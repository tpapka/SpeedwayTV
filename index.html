<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Embed</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://epiembeds.online/embed/tntsports3-uk" 
    width="100%" 
    height="100%" 
    frameborder="0" 
    scrolling="no" 
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen" 
    allowfullscreen>
  </iframe>
</body>
</html>
